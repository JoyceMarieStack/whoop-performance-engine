<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whoop Performance Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2129;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    header h1 a { color: var(--text); text-decoration: none; }
    header h1 a:hover { color: var(--accent); }
    header nav { display: flex; align-items: center; gap: 16px; }
    header nav a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }
    header nav a:hover { color: var(--accent-hover); }

    #auth-area a, #auth-area button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    #auth-area a:hover, #auth-area button:hover {
      background: var(--accent-hover);
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }

    /* ── Main Layout ── */
    main { max-width: 960px; margin: 0 auto; padding: 24px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .summary-card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .summary-card .body {
      padding: 16px;
      font-size: 14px;
      min-height: 90px;
    }
    .summary-card .headline {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .summary-card .subline {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .summary-card .view-link {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .summary-card .view-link:hover { color: var(--accent-hover); }
    .summary-card .muted {
      color: var(--text-dim);
      font-style: italic;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-right: 4px;
    }
    .badge-over-worked { background: rgba(248,81,73,0.15); color: var(--red); }
    .badge-under-worked { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .badge-balanced { background: rgba(63,185,80,0.15); color: var(--green); }

    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      main { padding: 16px; }
      .card-grid { grid-template-columns: 1fr; }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-dim);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1><a href="/">Whoop Performance Engine</a></h1>
  <nav>
    <a href="/" style="color:var(--yellow);">Home</a>
    <a href="/targets">Targets</a>
    <a href="/retro">Retro</a>
    <a href="/data-fetcher">Data Fetcher</a>
    <div id="auth-area">
      <span id="status-text"></span>
    </div>
  </nav>
</header>

<main>
  <div class="card-grid">
    <section class="summary-card" id="targets-card">
      <h2>Weekly Targets</h2>
      <div class="body">
        <div class="muted">Loading…</div>
      </div>
    </section>

    <section class="summary-card" id="retro-card">
      <h2>Muscle Balance Retro</h2>
      <div class="body">
        <div class="muted">Loading…</div>
      </div>
    </section>
  </div>
</main>

<footer>
  <a href="/openapi.yaml" target="_blank">OpenAPI Spec</a>
</footer>

<script>
  let isConnected = false;

  // ─── Auth Check ───
  async function checkAuth() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      isConnected = data.authenticated;
    } catch {
      isConnected = false;
    }
    renderAuth();
  }

  function renderAuth() {
    const area = document.getElementById('auth-area');
    if (isConnected) {
      area.innerHTML = '<span class="status-dot connected"></span><span style="font-size:14px;color:var(--green)">Connected</span>';
    } else {
      area.innerHTML = '<span class="status-dot disconnected"></span><a href="/auth/whoop">Connect to Whoop</a>';
    }
  }

  // ─── Weekly target classification (mirrors targets.html's SPORT_MAP) ───
  const SPORT_MAP = {
    44:  'strength', 45: 'strength', 123: 'strength',
    0:   'cardio',   1:  'cardio',
  };

  function getWeekStart(date) {
    const d = new Date(date);
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() - day + 1);
    d.setUTCHours(0, 0, 0, 0);
    return d;
  }

  async function loadTargetsSummary() {
    const card = document.querySelector('#targets-card .body');

    if (!isConnected) {
      card.innerHTML = '<div class="muted">Connect to Whoop to see this week\'s progress.</div>';
      return;
    }

    try {
      const weekStart = getWeekStart(new Date());
      const res = await fetch(`/api/workout?start=${weekStart.toISOString()}&end=${new Date().toISOString()}`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();

      let strength = 0, cardio = 0;
      for (const w of data.records || []) {
        if (w.score_state !== 'SCORED') continue;
        const category = SPORT_MAP[w.sport_id];
        if (category === 'strength') strength++;
        else if (category === 'cardio') cardio++;
      }

      const met = strength >= 3 && cardio >= 1;
      card.innerHTML = `
        <div class="headline">${strength}/3 strength &middot; ${cardio}/1 cardio</div>
        <div class="subline">${met ? 'Target met this week' : 'In progress this week'}</div>
        <a class="view-link" href="/targets">View full targets &rarr;</a>
      `;
    } catch (err) {
      card.innerHTML = `<div class="muted">Could not load targets summary: ${err.message}</div>`;
    }
  }

  async function loadRetroSummary() {
    const card = document.querySelector('#retro-card .body');

    if (!isConnected) {
      card.innerHTML = '<div class="muted">Connect to Whoop to see this week\'s retro.</div>';
      return;
    }

    try {
      const res = await fetch('/api/retro/muscle-balance');

      if (res.status === 503) {
        card.innerHTML = '<div class="muted">Hevy is not configured yet — add HEVY_API_KEY to .env to enable the retro.</div>';
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || `API error: ${res.status}`);
      }

      const data = await res.json();
      const p = data.completionProgress;
      const flags = Object.values(data.muscleGroups).map(g => g.flag);
      const overCount = flags.filter(f => f === 'over-worked').length;
      const underCount = flags.filter(f => f === 'under-worked').length;

      const recBadges = data.recommendation.muscleGroups.length
        ? data.recommendation.muscleGroups.map(g => `<span class="badge badge-under-worked">${g}</span>`).join(' ')
        : '<span class="badge badge-balanced">balanced</span>';

      card.innerHTML = `
        <div class="headline">${p.completed}/${p.target} workouts this week</div>
        <div class="subline">${overCount} over-worked &middot; ${underCount} under-worked</div>
        <div style="margin-bottom:12px;">${recBadges}</div>
        <a class="view-link" href="/retro">View full retro &rarr;</a>
      `;
    } catch (err) {
      card.innerHTML = `<div class="muted">Could not load retro summary: ${err.message}</div>`;
    }
  }

  async function init() {
    await checkAuth();
    loadTargetsSummary();
    loadRetroSummary();
  }

  init();
</script>

</body>
</html>
